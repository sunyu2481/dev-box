services:
  dev-box:
    image: ghcr.io/sunyu2481/dev-box:latest
    container_name: dev-box
    # 镜像 ENTRYPOINT 已内置 tini（含 -s subreaper），此项冗余但无害：
    # 保留作为兜底，防止运行时用 --entrypoint 覆盖掉 tini 后失去僵尸回收。
    init: true
    tty: true
    stdin_open: true
    working_dir: /workspace
    # 容器 sshd 默认只绑宿主机 loopback，不暴露公网——公网被爆破时每条未认证
    # 连接都会产生一个 pre-auth sshd 子进程。推荐从外部经宿主机 SSH 跳转连入
    # （ssh -J），只需开放宿主机自身的 22 端口，详见 README「通过 SSH 直连容器」。
    # 确需直接暴露时显式覆盖，例：DEVBOX_SSH_BIND=0.0.0.0 docker compose up -d
    ports:
      - "${DEVBOX_SSH_BIND:-127.0.0.1}:${DEVBOX_SSH_PORT:-2222}:22"
    environment:
      # 注入用于 SSH 公钥认证的公钥；留空则不启动 sshd。
      # 例：SSH_PUBLIC_KEY="$(cat ~/.ssh/id_ed25519.pub)" docker compose up -d
      - SSH_PUBLIC_KEY=${SSH_PUBLIC_KEY:-}
      # 健康汇报间隔（秒）：周期性把僵尸进程数与 SSH 认证失败增量打进 docker logs，
      # 仅在有异常时输出。设为 0 关闭汇报。
      - HEALTH_REPORT_INTERVAL=${HEALTH_REPORT_INTERVAL:-300}
      # ChromiumManager 的 CDP 网关地址。镜像不预装浏览器，agent 经此地址连接
      # 带指纹与代理的远程 Chromium 实例，详见 README「浏览器：接入 ChromiumManager」。
      # 需先与 chromium-manager 容器同网（见文件末尾 networks 注释）。
      - CHROMIUM_MANAGER_URL=${CHROMIUM_MANAGER_URL:-http://chromium-manager:10102}
      # ChromiumManager 设了 AGENT_TOKEN 时必须同步注入，否则 agent 接口返回 401。
      - CHROMIUM_MANAGER_TOKEN=${CHROMIUM_MANAGER_TOKEN:-}
    volumes:
      - ./workspace:/workspace
      - ./.vscode:/home/vscode
    # 所有子系统日志统一汇聚到容器 stdout（前缀 [init]/[sshd]/[gateway]），
    # 被爆破时 [sshd] 行会快速增长，需限制日志占用磁盘的上限。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# 与 ChromiumManager 组网（可选）
# 镜像不预装浏览器，需要浏览器时经 ChromiumManager 的 CDP 网关连接。两个容器必须
# 在同一 Docker 网络里，dev-box 才能用容器名 chromium-manager 解析到对方。
#
# 默认不启用：external 网络若不存在，`docker compose up` 会直接报错，这会打断
# 只想要开发环境、不需要浏览器的用法。需要时按以下三步启用：
#
#   1) docker network create agentnet
#   2) chromium-manager 侧 compose 加入同名网络（其 10102 不必 publish 到宿主机，
#      仅同网可达即可，避免把无鉴权的 CDP 网关暴露出去）
#   3) 取消下面两处注释后 docker compose up -d
#
# 反过来，若浏览器容器需要访问 dev-box 里起的开发服务器（见 README 的 localhost
# 陷阱），同网后用 http://dev-box:<port> 即可，且服务须监听 0.0.0.0 而非 127.0.0.1。
#
#    networks:
#      - agentnet
#
# networks:
#   agentnet:
#     external: true
