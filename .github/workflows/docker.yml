name: 构建并发布多架构开发镜像

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  schedule:
    # 每周一北京时间 11:17 完整重建，刷新系统安全补丁与最新命令行工具。
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      refresh_volatile_tools:
        description: '刷新 cc-connect 测试版、Claude Code、Codex、Antigravity CLI、Playwright 和 chrome-devtools-mcp，复用工具链缓存'
        required: false
        default: false
        type: boolean
      no_cache:
        description: '完整重建镜像，刷新系统安全补丁和所有预装工具'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 每次构建前解析一次，两个架构使用同一版本，新版本自动使安装缓存失效。
      - name: 解析 cc-connect 最新测试版
        id: cc_connect
        run: |
          CC_CONNECT_VERSION=$(curl -fsSL --retry 3 --connect-timeout 15 --max-time 60 https://registry.npmjs.org/-/package/cc-connect/dist-tags \
            | jq -er '.beta | select(type == "string") | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+-[0-9A-Za-z.-]+$"))')
          printf '解析到 cc-connect 测试版：%s\n' "$CC_CONNECT_VERSION"
          printf 'version=%s\n' "$CC_CONNECT_VERSION" >> "$GITHUB_OUTPUT"

      - name: 配置跨架构模拟
        uses: docker/setup-qemu-action@v3

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=${{ github.event.repository.name }}
            org.opencontainers.image.description=Multi-arch development container image
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.repository_owner }}
            org.opencontainers.image.licenses=MIT

      - name: 构建并发布多架构镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          no-cache: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.no_cache) }}
          build-args: |
            CC_CONNECT_VERSION=${{ steps.cc_connect.outputs.version }}
            VOLATILE_TOOLS_CACHE_BUST=${{ github.event_name == 'workflow_dispatch' && inputs.refresh_volatile_tools && github.run_id || '0' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证启动脚本与 Docker 客户端权限
        env:
          BUILT_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          # 仅在工作流运行器执行，测试容器不挂载宿主机目录或真实 Docker 套接字。
          docker run --rm -i "$BUILT_IMAGE" node < tests/cc-connect-smoke.cjs
          docker run --rm -i "$BUILT_IMAGE" node < tests/docker-smoke.cjs
